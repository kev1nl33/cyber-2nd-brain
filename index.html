<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Cyber 第二大脑 · 神经网络视图</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
  <div id="app" class="app" data-motion="on">
    <canvas id="bg-canvas" class="bg-canvas" aria-hidden="true"></canvas>
    <div class="grain" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <header class="top-bar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M3 12h4l2-5 3 10 3-7 2 2h4" /></svg>
        </span>
        <span class="brand-text">CYBER <b>BRAIN</b></span>
      </div>
      <nav class="breadcrumb" id="breadcrumb" aria-label="层级"></nav>
      <div class="top-actions">
        <span class="status-line" id="status-line"></span>
        <span class="sample-hint" id="sample-hint" hidden>示例数据</span>
        <button type="button" class="chip" id="motion-toggle" aria-pressed="false">动效 开</button>
        <button type="button" class="chip chip--back" id="back-btn" hidden>返回上层</button>
      </div>
    </header>

    <main class="stage" id="stage" aria-label="思考图谱画布">
      <div class="stars" id="stars" role="group" aria-label="天秤座：行为模式与可复用经验"></div>
      <svg class="edges" id="edges" aria-hidden="true">
        <defs>
          <marker id="arrow-recorded" markerWidth="7" markerHeight="7" refX="5.6" refY="3" orient="auto">
            <path d="M0,0 L6,3 L0,6 Z" />
          </marker>
          <marker id="arrow-inferred" markerWidth="7" markerHeight="7" refX="5.6" refY="3" orient="auto">
            <path d="M0,0 L6,3 L0,6 Z" />
          </marker>
          <marker id="arrow-warm" markerWidth="7" markerHeight="7" refX="5.6" refY="3" orient="auto">
            <path d="M0,0 L6,3 L0,6 Z" />
          </marker>
        </defs>
        <g id="edge-group"></g>
        <path id="popover-connector-path" class="popover-connector" />
      </svg>
      <div class="edge-tags" id="edge-tags" aria-hidden="true"></div>
      <div class="nodes" id="nodes" role="group" aria-label="大脑、问题与思考步骤"></div>
    </main>

    <aside class="popover" id="popover" hidden tabindex="-1" role="dialog" aria-labelledby="popover-title">
      <header class="popover-handle" id="popover-handle">
        <h2 class="popover-title" id="popover-title"></h2>
        <button type="button" class="popover-close" id="popover-close" aria-label="关闭浮框">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1 1 L11 11 M11 1 L1 11" /></svg>
        </button>
      </header>
      <div class="popover-kicker" id="popover-kicker"></div>
      <div class="popover-body" id="popover-body"></div>
      <div class="popover-actions" id="popover-actions"></div>
    </aside>

    <footer class="bottom-bar">
      <div class="legend" aria-label="连线图例">
        <span class="legend-item"><i class="legend-line legend-line--recorded"></i>记录中的先后</span>
        <span class="legend-item"><i class="legend-line legend-line--inferred"></i>整理的关联 · 待确认</span>
        <span class="legend-item"><i class="legend-line legend-line--source"></i>来源引用</span>
        <span class="legend-item"><i class="legend-dot legend-dot--warm"></i>阶段理解</span>
        <span class="legend-item"><i class="legend-star" aria-hidden="true"></i>可复用经验</span>
      </div>
      <div class="view-controls">
        <button type="button" class="chip chip--icon" id="zoom-out" aria-label="缩小">−</button>
        <button type="button" class="chip chip--icon" id="zoom-reset" aria-label="复位视图">◎</button>
        <button type="button" class="chip chip--icon" id="zoom-in" aria-label="放大">＋</button>
      </div>
    </footer>

    <div class="intro" id="intro-overlay" hidden>
      <svg class="intro-brain" id="intro-brain" viewBox="-110 -110 220 220" aria-hidden="true"></svg>
      <div class="intro-caption" aria-hidden="true">
        <span class="intro-line">SYSTEM / PERSONAL NEURAL SPACE</span>
        <strong>CYBER <em>BRAIN</em></strong>
        <span class="intro-sub">0 1 0 1 · 你的记录正在成形</span>
      </div>
      <button type="button" class="intro-skip" id="intro-skip">跳过开场</button>
    </div>
  </div>

  <script src="./private-data/flomo.js"></script>
  <script src="./private-data/thoughts.js"></script>
  <script src="./private-data/lessons.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
